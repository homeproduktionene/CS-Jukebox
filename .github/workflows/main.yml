name: Build & Release CS-Jukebox

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MSBuild einrichten
        uses: microsoft/setup-msbuild@v2

      - name: NuGet restore (gesamte Solution)
        run: nuget restore CS-Jukebox.sln

      - name: CSGSI bauen (net48 – auf Runner vorinstalliert)
        run: |
          msbuild CSGSI/CSGSI.csproj `
            /p:Configuration=Release `
            /p:Platform=AnyCPU `
            /p:TargetFrameworkVersion=v4.8 `
            /nologo /verbosity:minimal

      - name: dotnet restore für win-x64 Runtime
        run: dotnet restore CS-Jukebox/CS-Jukebox.csproj --runtime win-x64

      - name: CS-Jukebox publizieren (nur MSBuild, kein dotnet)
        run: |
          msbuild CS-Jukebox/CS-Jukebox.csproj `
            /t:Publish `
            /p:Configuration=Release `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:DebugType=embedded `
            /p:PublishDir=..\publish\ `
            /p:BuildProjectReferences=false `
            /nologo /verbosity:minimal

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CS-Jukebox-${{ github.ref_name }}
          path: |
            publish/CS-Jukebox.exe
            publish/gamestate_integration_jukebox.cfg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Artefakte herunterladen
        uses: actions/download-artifact@v4
        with:
          name: CS-Jukebox-${{ github.ref_name }}
          path: dist/

      - name: ZIP fürs Release packen
        run: zip -j CS-Jukebox-${{ github.ref_name }}.zip dist/*

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: CS-Jukebox-${{ github.ref_name }}.zip
          generate_release_notes: true
