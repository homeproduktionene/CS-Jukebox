name: Build & Release CS-Jukebox

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MSBuild einrichten
        uses: microsoft/setup-msbuild@v2

      - name: .NET 8 SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: .NET Framework 4.5 Targeting Pack installieren
        run: choco install netfx-4.5-devpack --yes --no-progress
        shell: cmd

      - name: NuGet restore (gesamte Solution)
        run: nuget restore CS-Jukebox.sln

      - name: Solution mit MSBuild bauen
        run: |
          msbuild CS-Jukebox.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /nologo `
            /verbosity:minimal

      - name: CS-Jukebox publizieren
        run: |
          msbuild CS-Jukebox/CS-Jukebox.csproj `
            /p:Configuration=Release `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:DebugType=embedded `
            /p:OutDir=..\publish\ `
            /t:Publish `
            /nologo `
            /verbosity:minimal

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CS-Jukebox-${{ github.ref_name }}
          path: |
            publish/CS-Jukebox.exe
            publish/gamestate_integration_jukebox.cfg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Artefakte herunterladen
        uses: actions/download-artifact@v4
        with:
          name: CS-Jukebox-${{ github.ref_name }}
          path: dist/

      - name: ZIP fürs Release packen
        run: zip -j CS-Jukebox-${{ github.ref_name }}.zip dist/*

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: CS-Jukebox-${{ github.ref_name }}.zip
          generate_release_notes: true
