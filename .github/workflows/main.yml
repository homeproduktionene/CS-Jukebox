name: Build & Release CS-Jukebox

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SDK 8 (LTS) – kann net5.0-windows noch bauen, ist aber aktuell supported
      - name: .NET 8 SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # MSBuild aus der vorinstallierten Visual-Studio-Installation holen
      - name: MSBuild einrichten
        uses: microsoft/setup-msbuild@v2

      # .NET Framework 4.5 Targeting Pack – wird von CSGSI.csproj (net45) benötigt
      - name: .NET Framework 4.5 Targeting Pack installieren
        run: choco install netfx-4.5-devpack --yes --no-progress

      # Klassisches NuGet restore für das alte CSGSI-Projekt (packages.config)
      - name: NuGet restore (CSGSI – packages.config)
        run: nuget restore CS-Jukebox.sln

      # SDK-style restore für das Hauptprojekt
      - name: dotnet restore (CS-Jukebox)
        run: dotnet restore CS-Jukebox/CS-Jukebox.csproj

      # CSGSI separat mit klassischem MSBuild bauen
      - name: CSGSI bauen (MSBuild / net45)
        run: msbuild CSGSI/CSGSI.csproj /p:Configuration=Release /p:Platform=AnyCPU /nologo /verbosity:minimal

      # Hauptprojekt publizieren – CSGSI ist jetzt bereits gebaut
      - name: CS-Jukebox publizieren (self-contained EXE)
        run: |
          dotnet publish CS-Jukebox/CS-Jukebox.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=embedded `
            --output publish/

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CS-Jukebox-${{ github.ref_name }}
          path: |
            publish/CS-Jukebox.exe
            publish/gamestate_integration_jukebox.cfg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Artefakte herunterladen
        uses: actions/download-artifact@v4
        with:
          name: CS-Jukebox-${{ github.ref_name }}
          path: dist/

      - name: ZIP fürs Release packen
        run: zip -j CS-Jukebox-${{ github.ref_name }}.zip dist/*

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: CS-Jukebox-${{ github.ref_name }}.zip
          generate_release_notes: true
        with:
          files: CS-Jukebox-${{ github.ref_name }}.zip
          generate_release_notes: true
